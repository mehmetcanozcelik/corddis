[workspace]
resolver = "2"
members = ["crates/proto", "crates/client", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
corddis-proto = { path = "crates/proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chacha20poly1305 = "0.10"
anyhow = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "io-util", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"

# MVP.md §8: küçük, hızlı, tek binary.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Ses kodunu debug'da da makul hızda çalıştır (opus/rnnoise debug'da çok yavaş).
[profile.dev.package."*"]
opt-level = 2
